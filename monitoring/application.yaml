# Deploy the lightweight PAHP monitoring stack through Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pahp-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.0
    helm:
      releaseName: pahp-monitoring
      valuesObject:
        alertmanager:
          enabled: false
        defaultRules:
          create: false
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: 6GB
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 768Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 8Gi
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: false
          service:
            type: ClusterIP
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          sidecar:
            dashboards:
              enabled: true
          grafana.ini:
            auth.anonymous:
              enabled: false
            users:
              allow_sign_up: false
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: pahp-monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
