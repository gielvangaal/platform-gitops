apiVersion: v1
kind: Service
metadata:
  name: soulsearch-web
spec:
  type: ClusterIP
  selector:
    app: soulsearch-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soulsearch-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soulsearch-web
  template:
    metadata:
      labels:
        app: soulsearch-web
    spec:
      imagePullSecrets:
        - name: soulsearch-ghcr
      containers:
        - name: web
          image: ghcr.io/gielvangaal/soulsearch-web:324123e1f46042ceb958bcea2ee1361eff6cf197
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ApiBaseUrl
              value: http://soulsearch-api
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
