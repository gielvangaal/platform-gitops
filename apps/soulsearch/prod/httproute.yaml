apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soulsearch
spec:
  parentRefs:
    - name: pahp-http
      namespace: kube-system
      sectionName: soulsearch-https
  hostnames:
    - soulsearch.gielvangaal.dev
  rules:
    # Browser media URLs currently use /api/media; the API exposes /media.
    - matches:
        - path:
            type: PathPrefix
            value: /api/media
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /media
      backendRefs:
        - name: soulsearch-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /media
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: soulsearch-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: soulsearch-web
          port: 80
