apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soulsearch
spec:
  parentRefs:
    - name: pahp-http
      namespace: kube-system
      sectionName: soulsearch-https
  hostnames:
    - soulsearch.gielvangaal.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: soulsearch-web
          port: 80
