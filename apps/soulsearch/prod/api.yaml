apiVersion: v1
kind: Service
metadata:
  name: soulsearch-api
spec:
  type: ClusterIP
  selector:
    app: soulsearch-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soulsearch-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soulsearch-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soulsearch-api
  template:
    metadata:
      labels:
        app: soulsearch-api
    spec:
      imagePullSecrets:
        - name: soulsearch-ghcr
      containers:
        - name: api
          image: ghcr.io/gielvangaal/soulsearch-api:9f282a2eea1cfd2197f72529eea32ef5cfb2d77c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulsearch-db
                  key: password
            - name: ConnectionStrings__DefaultConnection
              value: "Server=soulsearch-mysql;Port=3306;Database=soulsearch;User=soulsearch;Password=$(DB_PASSWORD);"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: soulsearch-api
                  key: jwt-key
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: soulsearch-uploads
