apiVersion: v1
kind: Service
metadata:
  name: soulsearch-mysql
spec:
  type: ClusterIP
  selector:
    app: soulsearch-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: soulsearch-mysql
spec:
  serviceName: soulsearch-mysql
  replicas: 1
  selector:
    matchLabels:
      app: soulsearch-mysql
  template:
    metadata:
      labels:
        app: soulsearch-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: soulsearch
            - name: MYSQL_USER
              value: soulsearch
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulsearch-db
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulsearch-db
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
