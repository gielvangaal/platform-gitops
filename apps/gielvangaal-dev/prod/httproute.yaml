apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
spec:
  parentRefs:
    - name: pahp-http
      namespace: kube-system
      sectionName: https
  hostnames:
    - gielvangaal.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /media
      backendRefs:
        - name: portfolio-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portfolio-frontend
          port: 80
