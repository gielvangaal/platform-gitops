# Redirect ordinary HTTP traffic while leaving more specific ACME solver routes eligible.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-http-redirect
spec:
  parentRefs:
    - name: pahp-http
      namespace: kube-system
      sectionName: http
  hostnames:
    - gielvangaal.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
