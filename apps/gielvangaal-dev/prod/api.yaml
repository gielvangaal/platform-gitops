apiVersion: v1
kind: Service
metadata:
  name: portfolio-api
spec:
  selector:
    app: portfolio-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portfolio-api
  template:
    metadata:
      labels:
        app: portfolio-api
    spec:
      containers:
        - name: api
          image: ghcr.io/gielvangaal/portfolio-api:sha-4d5c66b5dc2bc6baf595d4ddd92a380cfd69d221
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-db
                  key: password
            - name: ConnectionStrings__DefaultConnection
              value: "Server=mysql;Port=3306;Database=portfolio;User=portfolio;Password=$(DB_PASSWORD);"
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
