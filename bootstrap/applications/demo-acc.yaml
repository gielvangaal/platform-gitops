# Register a harmless ACC smoke test; apply manually after owner approval.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-acc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gielvangaal/platform-gitops.git
    targetRevision: develop
    path: apps/demo/acc
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-acc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
