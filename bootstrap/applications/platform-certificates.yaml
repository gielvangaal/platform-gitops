apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pahp-platform-certificates
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gielvangaal/platform-gitops.git
    targetRevision: main
    path: infrastructure/certificates
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
